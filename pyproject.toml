[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-suitability"
version = "0.1.0"
description = "Crop suitability prediction and crop recommendation from soil and weather data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "rapidfuzz>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
app = ["gradio>=4.0"]
explain = ["shap>=0.44"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
crop-predict = "crop_suitability.predict:main"
crop-train = "crop_suitability.train:main"
crop-app = "crop_suitability.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
